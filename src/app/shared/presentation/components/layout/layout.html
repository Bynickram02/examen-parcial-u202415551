<mat-toolbar class="toolbar" role="banner">
  <button mat-icon-button (click)="sidenav.toggle()" [attr.aria-label]="'toolbar.toggle-menu' | translate">
    <mat-icon>menu</mat-icon>
  </button>
  <img class="logo" src="assets/images/aqualife-logo.svg" alt="AquaLife logo">
  <span class="title">{{ 'toolbar.title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher/>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav class="sidenav" [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()"
               role="navigation" [attr.aria-label]="'navigation.label' | translate">
    <mat-nav-list>
      @for (option of options; track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active" #link="routerLinkActive"
           [activated]="link.isActive" [attr.aria-current]="link.isActive ? 'page' : null"
           (click)="isHandset() && sidenav.close()">
          <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
          <span matListItemTitle>{{ option.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
